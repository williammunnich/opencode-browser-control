<!doctype html>
<!--
  @file approve.html
  The extension's own approval page. It is shown in a tab in three situations (see approve.js):
  when OpenCode wants to open a site you have not approved (the site is not loaded until you
  click Allow, so nothing is sent to it and nothing on it is read before that), when you press
  "Review" on the bar inside a page, and when OpenCode asks for browser control to be switched
  on. Web pages cannot open, frame or script this page, which is why sites are approved here
  and not inside the page.
  Project: opencode-browser-control
  @author Claude (Anthropic), written for and prompted by William Munnich
  @date Last edited 2026-11-14
-->
<html lang="en"><head><meta charset="utf-8"><title>OpenCode Browser Control: your answer is needed</title>
<style>
  /* ----------------------------------------------------------------------------------------
   * Theme: every colour of this page is set here (light first, then dark). Change these to
   * restyle it.
   *   --bg page background        --card the box in the middle     --fg text
   *   --muted secondary text      --code-bg / --code-fg the address shown
   *   --accent Allow buttons      --accent-hover under the mouse
   *   --danger Deny button        --danger-hover under the mouse   --on-accent text on buttons
   * -------------------------------------------------------------------------------------- */
  :root{--bg:#f4f4f5;--card:#fff;--fg:#18181b;--muted:#52525b;--code-bg:#f4f4f5;--code-fg:#1d4ed8;
    --accent:#2563eb;--accent-hover:#1d4ed8;--danger:#dc2626;--danger-hover:#b91c1c;--on-accent:#fff;--shadow:0 10px 40px rgba(0,0,0,.12)}
  @media (prefers-color-scheme:dark){:root{--bg:#18181b;--card:#27272a;--fg:#f4f4f5;--muted:#d4d4d8;--code-bg:#18181b;--code-fg:#93c5fd;--shadow:0 10px 40px rgba(0,0,0,.4)}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{max-width:560px;padding:32px;margin:16px;border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
  h1{font-size:20px;margin:0 0 8px} code{display:block;margin:12px 0 20px;padding:10px 12px;border-radius:8px;background:var(--code-bg);color:var(--code-fg);word-break:break-all;font-size:13px}
  p{margin:0 0 12px;color:var(--muted)} .row{display:flex;gap:10px;flex-wrap:wrap}
  button{cursor:pointer;border:0;border-radius:999px;padding:10px 18px;font:600 14px/1 inherit;color:var(--on-accent);background:var(--accent)} button:hover{background:var(--accent-hover)}
  button.deny{background:var(--danger)} button.deny:hover{background:var(--danger-hover)}
</style></head>
<body><main>
  <h1>OpenCode wants to open <span id="host"></span></h1>
  <p>It will be able to read this site and click and type on it, in its own tab group only. It does not type into password or card fields.</p>
  <code id="url"></code>
  <div class="row">
    <button id="once">Allow once</button><button id="always">Always allow this site</button><button id="deny" class="deny">Deny</button>
  </div>
  <p id="note" style="margin-top:16px"></p>
</main><script src="approve.js"></script></body></html>
